name: Unit tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Protocol tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      # 只跑协议层的单元测试，不需要 android/ 目录。
      - name: Resolve dependencies
        run: flutter pub get

      # 失败时把「哪个测试挂了 + 第一段异常」以注解形式发出来：
      # GitHub 的 job 日志托管在 Azure，外部工具经常抓不到，
      # 而 annotations 是可以通过 API 读到的。
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          log=/tmp/test.log
          if flutter test --reporter expanded 2>&1 | tee "$log"; then
            echo "全部测试通过"
            exit 0
          fi
          echo "::error::flutter test 失败，下面是从日志里提取的关键行"
          n=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "::error::$(printf '%s' "$line" | tr -d '\r' | cut -c1-600)"
            n=$((n + 1))
            if [ "$n" -ge 10 ]; then break; fi
          done < <(grep -aE "\[E\]|Expected:|Actual:|which:|Error:|error:|The following|Failed to load|Failing tests" "$log" | head -10 || true)
          exit 1
