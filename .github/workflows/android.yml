name: Android APK (arm64-v8a)

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 3.47.x 是当前 stable；固定到具体补丁号，免得下个 stable 把模板换掉。
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Generate Android platform folder
        run: dart tool/bootstrap.dart --platforms=android

      # 把 wrapper 缓存目录也缓存下来：只要成功过一次，
      # 后面即使所有下载源都挂了也能直接命中。
      - name: Restore Gradle distribution cache
        uses: actions/cache@v5
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-dists-9.3.1-${{ runner.os }}-v1
          restore-keys: |
            gradle-wrapper-dists-9.3.1-

      # Gradle 分发包的下载是这一串红灯的根源：
      #   * 模板默认指向 services.gradle.org，它会 307 到 GitHub Releases，
      #     而 GitHub 的 release 资源会回 504（2026-11-08 官方 CDN 也一起 504）；
      #   * 一旦抖动，wrapper 直接失败。
      # 这里不再猜哪个源一定能用：按顺序试多个源（官方 + 国内镜像），
      # 然后把分发包**预先解压到 wrapper 缓存目录**，构建时完全不需要联网。
      # 全部源都挂时，用 runner 自带的 Gradle 兜底。
      - name: Prepare Gradle distribution (offline cache)
        shell: bash
        run: |
          set -euo pipefail
          props=android/gradle/wrapper/gradle-wrapper.properties
          if [ ! -f "$props" ]; then
            echo "::error::找不到 $props（bootstrap 没有生成 android/）"
            exit 1
          fi

          echo "--- 模板原始配置 ---"
          cat "$props"

          # properties 里冒号写成 https\:// —— 先把反斜杠去掉，才是真正的 URL
          raw=$(grep -E '^[[:space:]]*distributionUrl' "$props" | head -1 | sed -E 's/^[^=]*=[[:space:]]*//' | tr -d '\\')
          echo "原始 distributionUrl: $raw"
          file=$(basename "${raw%%\?*}")
          version=$(printf '%s' "$file" | sed -E 's/^gradle-([0-9][0-9.]*)-(all|bin)\.zip$/\1/')
          echo "Gradle 版本: ${version} / 分发包: ${file}"
          if [ -z "${version:-}" ] || [ "$version" = "$file" ]; then
            echo "::error::无法从 $raw 解析 Gradle 版本"
            exit 1
          fi

          base="${GRADLE_USER_HOME:-$HOME/.gradle}/wrapper/dists/${file%.zip}"
          mkdir -p "$base"
          tmp="${RUNNER_TEMP:-/tmp}/gradle-dist"
          mkdir -p "$tmp"

          # Gradle 的缓存目录名 = md5(distributionUrl) 的 base36
          hash_of() {
            python3 - "$1" <<'PY'
          import hashlib, sys
          n = int.from_bytes(hashlib.md5(sys.argv[1].encode("utf-8")).digest(), "big")
          alphabet = "0123456789abcdefghijklmnopqrstuvwxyz"
          out = ""
          while n:
              n, r = divmod(n, 36)
              out = alphabet[r] + out
          print(out or "0")
          PY
          }

          candidates=(
            "$raw"
            "https://downloads.gradle.org/distributions/$file"
            "https://services.gradle.org/distributions/$file"
            "https://mirrors.huaweicloud.com/gradle/$file"
            "https://mirrors.nju.edu.cn/gradle/$file"
            "https://mirrors.cloud.tencent.com/gradle/$file"
            "https://downloads.gradle-dn.com/distributions/$file"
          )

          url=""
          root=""
          mode=""
          # 1) 命中上次缓存（缓存目录按 URL 的 hash 命名，必须用同一个 URL 才算命中）
          for src in "${candidates[@]}"; do
            h=$(hash_of "$src")
            # 兜底产物（runner 预装的 Gradle）不算命中：等镜像恢复后要能自动换回真包。
            if [ -f "$base/$h/$file.ok" ] && [ ! -f "$base/$h/PREINSTALLED" ]; then
              url="$src"
              root="$base/$h"
              mode="cache"
              echo "缓存命中: $src"
              break
            fi
          done

          # 2) 依次下载（每个源都实际校验 zip 完整性）
          if [ -z "$root" ]; then
            for src in "${candidates[@]}"; do
              echo "尝试下载: $src"
              if curl -fL --retry 2 --retry-all-errors --retry-delay 2 \
                   --connect-timeout 15 --max-time 600 \
                   -o "$tmp/$file" "$src" 2>/dev/null \
                 && unzip -tq "$tmp/$file" >/dev/null 2>&1; then
                url="$src"
                root="$base/$(hash_of "$src")"
                mode="download"
                echo "下载成功: $src ($(du -h "$tmp/$file" | cut -f1))"
                break
              fi
              rm -f "$tmp/$file"
              echo "不可用: $src"
            done
          fi

          if [ "$mode" = "download" ]; then
            rm -rf "$root"
            mkdir -p "$root"
            unzip -q "$tmp/$file" -d "$root"
            rm -f "$tmp/$file"
            # 解压出来的顶层目录名不一定是 zip 名（-all 包里面是 gradle-<版本>），
            # 所以检查「恰好一个目录 + 里面有启动器 jar」。
            dirs=$(find "$root" -mindepth 1 -maxdepth 1 -type d | wc -l)
            launcher=$(find "$root" -name 'gradle-launcher-*.jar' | head -1)
            if [ "$dirs" != "1" ] || [ -z "$launcher" ]; then
              echo "::error::解压结果不像一个 Gradle 发行包（目录数 $dirs，启动器 jar: ${launcher:-无}）"
              ls -la "$root"
              exit 1
            fi
            touch "$root/$file.ok"
          fi

          # 3) 兜底：所有源都挂了就用 runner 预装的 Gradle（ubuntu 镜像自带 9.x）
          if [ -z "$root" ]; then
            echo "::warning::所有下载源都不可用，改用 runner 预装的 Gradle"
            if ! command -v gradle >/dev/null 2>&1; then
              echo "::error::runner 上没有预装 gradle，无法离线准备"
              exit 1
            fi
            gradle -v | head -8 || true
            gradle_home="$(cd "$(dirname "$(command -v gradle)")/.." && pwd)"
            url="$raw"
            root="$base/$(hash_of "$url")"
            rm -rf "$root"
            mkdir -p "$root"
            cp -a "$gradle_home" "$root/gradle-$version"
            touch "$root/$file.ok"
            touch "$root/PREINSTALLED"
            mode="preinstalled"
          fi

          # 写回 properties（冒号按 Java properties 的规矩转义）
          esc=${url//:/\\:}
          URL_ESC="$esc" python3 - "$props" <<'PY'
          import os, re, sys
          path = sys.argv[1]
          text = open(path, encoding="utf-8").read()
          url = os.environ["URL_ESC"]
          text = re.sub(r'^[ \t]*distributionUrl.*$', 'distributionUrl=' + url, text, flags=re.M)
          if 'networkTimeout=' not in text:
              text = text.rstrip() + '\nnetworkTimeout=120000\n'
          if 'retries=' not in text:
              text = text.rstrip() + '\nretries=5\n'
          if 'retryBackOffMs=' not in text:
              text = text.rstrip() + '\nretryBackOffMs=3000\n'
          open(path, 'w', encoding="utf-8").write(text)
          PY
          echo "--- 改写后 ---"
          cat "$props"
          echo "缓存目录: $root（来源：$mode）"
          ls -la "$root"

          # 立刻让 wrapper 跑一次 --version：它如果还要联网，说明缓存没被认出来，
          # 在这里就报清楚，而不是等 6 分钟后的构建超时。
          if ! (cd android && ./gradlew --version > /tmp/gradlew-check.log 2>&1); then
            echo "::error::gradlew --version 失败：缓存没有被 wrapper 识别"
            tail -40 /tmp/gradlew-check.log || true
            exit 1
          fi
          head -10 /tmp/gradlew-check.log

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APK (arm64-v8a)
        shell: bash
        run: |
          set -o pipefail
          echo "--- 构建时使用的 wrapper 配置 ---"
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo "--- 环境 ---"
          flutter --version | head -3 || true
          java -version 2>&1 | head -2 || true
          df -h / | tail -1 || true

          for attempt in 1 2 3; do
            log="/tmp/build_${attempt}.log"
            if flutter build apk --release --target-platform android-arm64 2>&1 | tee "$log"; then
              echo "APK 构建成功（第 $attempt 次尝试）"
              exit 0
            fi
            echo "APK 构建失败（第 $attempt 次尝试）"
            # 把真正的失败原因以注解形式发出来：即使完整日志抓不到，
            # 也能从 GitHub 的 annotations 里直接看到。
            n=0
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              echo "::error::$(printf '%s' "$line" | tr -d '\r' | cut -c1-600)"
              n=$((n + 1))
              if [ "$n" -ge 6 ]; then break; fi
            done < <(grep -aE "FAILURE:|What went wrong|Caused by:|^error:|Execution failed|Could not (resolve|find|download|determine)|FileNotFoundException|OutOfMemory|No space left|SDK location|Unsupported class file|Could not create service" "$log" | head -6 || true)
            delay=$((attempt * 20))
            echo "${delay}s 后重试…"
            sleep "$delay"
          done
          echo "连续 3 次构建失败，放弃。"
          exit 1

      - name: Rename artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             dist/EdifierFitControl-${{ github.run_number }}-arm64-v8a.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: edifier-fit-control-apk-arm64-v8a
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90
